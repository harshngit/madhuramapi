name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Test connectivity
        run: nc -zv ${{ secrets.SSH_HOST }} 22

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            bash /var/www/madhuramapi/deploy.sh
            # Non-interactive SSH may not have node on PATH when it is installed through nvm.
            if [ -s "$HOME/.nvm/nvm.sh" ]; then . "$HOME/.nvm/nvm.sh"; fi
            cd /var/www/madhuramapi
            # Safe to repeat on every deploy: it only adds what is missing. Fails the deploy if it errors.
            node src/scripts/apply_billing_schema.js
